<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#06090d">
<title>Arc Reactor — подарунок</title>
<style>
/* Layout: сцена зверху на всю ширину, історія по кроках знизу (на ПК — праворуч) */
:root{
  --bg:#06090d; --panel:#0c1218; --line:#1f2b36; --fg:#eaf2f7; --muted:#8fa5b5;
  --glow:#66dcff; --glow-dim:rgba(102,220,255,.16); --gold:#ffc66b; --wire:#3d8bff;
  --f-display: "Avenir Next Condensed","Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;height:100dvh;display:grid;grid-template-columns:1fr minmax(320px,380px)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 45%,#0f1c27 0%,#081018 45%,var(--bg) 80%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:none;white-space:nowrap;
  font:600 12px var(--f-body);color:var(--fg);background:rgba(8,14,20,.82);border:1px solid var(--glow);
  border-radius:999px;padding:4px 10px;transition:opacity .35s}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:var(--glow);opacity:.7}
.tag.wire{border-color:var(--wire)} .tag.wire::after{background:var(--wire)}
.tag.gold{border-color:var(--gold)} .tag.gold::after{background:var(--gold)}
.top{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));pointer-events:none}
.top .k{font:600 11px var(--f-mono);letter-spacing:.22em;color:var(--glow);text-transform:uppercase}
.drag{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:12px;font:12px var(--f-mono);color:var(--muted);pointer-events:none;opacity:.8}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.story{flex:1;overflow:auto;padding:26px 26px 12px}
.num{font:600 12px var(--f-mono);letter-spacing:.18em;color:var(--muted)}
h1{font:700 34px/1.02 var(--f-display);letter-spacing:.01em;margin:8px 0 12px;text-wrap:balance;text-transform:uppercase}
h1 em{font-style:normal;color:var(--glow)}
.story p{margin:0 0 12px;color:#c8d6e0;max-width:60ch}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 6px}
.stats div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#0a1016}
.stats b{display:block;font:700 22px var(--f-display);color:var(--fg);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.legend{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.legend div{display:flex;gap:10px;align-items:center;font-size:14px;color:#c8d6e0}
.legend i{width:14px;height:14px;border-radius:3px;flex:none}
.nav{display:flex;align-items:center;gap:10px;padding:12px 18px max(14px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dots button{width:8px;height:8px;padding:0;border-radius:50%;border:0;background:#2a3946;cursor:pointer}
.dots button[aria-current="true"]{background:var(--glow);box-shadow:0 0 10px var(--glow)}
.btn{font:600 14px var(--f-body);color:var(--fg);background:#121b24;border:1px solid var(--line);border-radius:10px;padding:11px 16px;cursor:pointer;min-width:92px}
.btn.primary{background:var(--glow-dim);border-color:var(--glow)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible,.dots button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.foot{font:11px var(--f-mono);color:#5d7282;padding:0 26px 10px}
/* ---------- термінал / HUD ---------- */
#stage{background:
  linear-gradient(rgba(102,220,255,.045) 1px,transparent 1px) 0 0/34px 34px,
  linear-gradient(90deg,rgba(102,220,255,.045) 1px,transparent 1px) 0 0/34px 34px,
  radial-gradient(90% 70% at 50% 45%,#0f1c27 0%,#081018 45%,var(--bg) 80%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.hud{position:absolute;inset:0;pointer-events:none;font:600 10.5px var(--f-mono);letter-spacing:.12em;color:var(--glow)}
.hud .c{position:absolute;width:22px;height:22px;border:2px solid var(--glow);opacity:.75}
.hud .c.tl{left:10px;top:10px;border-right:0;border-bottom:0}.hud .c.tr{right:10px;top:10px;border-left:0;border-bottom:0}
.hud .c.bl{left:10px;bottom:10px;border-right:0;border-top:0}.hud .c.br{right:10px;bottom:10px;border-left:0;border-top:0}
.hud .ro{position:absolute;right:max(18px,env(safe-area-inset-right,0px));top:max(16px,env(safe-area-inset-top,0px));text-align:right;line-height:1.6;opacity:.85;font-variant-numeric:tabular-nums}
.hud .ro2{position:absolute;left:max(18px,env(safe-area-inset-left,0px));bottom:16px;line-height:1.6;opacity:.85}
.hud .blink{animation:blink 1s steps(2) infinite}
.ring{position:absolute;border-radius:50%;border:1px dashed rgba(102,220,255,.35);animation:spin 40s linear infinite;pointer-events:none}
.ring.r2{border:1px solid rgba(102,220,255,.12);border-top-color:rgba(102,220,255,.7);animation-duration:7s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
.tag{border-radius:2px;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:rgba(6,12,18,.85)}
.tag::before{content:"◢ ";color:var(--glow)}
aside{background:linear-gradient(180deg,#0b1218,#080d12);font-family:var(--f-mono)}
.story{position:relative}
.path{font:500 11px var(--f-mono);color:#4f6a7d;letter-spacing:.08em;margin-bottom:6px;word-break:break-all}
.num{color:var(--glow)}
h1{font:700 30px/1.08 var(--f-mono);letter-spacing:.02em;text-shadow:0 0 18px rgba(102,220,255,.35)}
h1 .cur{display:inline-block;width:.55em;height:.9em;background:var(--glow);vertical-align:-.08em;margin-left:4px;animation:blink 1s steps(2) infinite}
.story p{font:14px/1.6 var(--f-body);color:#c4d4df}
.story p::before{content:"> ";color:var(--glow);font-family:var(--f-mono)}
.ln{opacity:0;transform:translateY(6px);animation:lnIn .45s ease forwards}
@keyframes lnIn{to{opacity:1;transform:none}}
.stats div{border-color:#1b3140;background:linear-gradient(180deg,rgba(102,220,255,.06),transparent)}
.stats b{font-family:var(--f-mono);color:var(--glow);text-shadow:0 0 12px rgba(102,220,255,.4)}
.btn{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border-radius:3px}
.btn.primary{box-shadow:0 0 16px rgba(102,220,255,.25) inset}
/* креслення */
.bp-sec{width:100%;aspect-ratio:4/3;max-width:100%;display:block;border:1px solid #1b3a52;border-radius:3px;margin:8px 0 12px;background:#071a2a}
.bp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin:6px 0 10px}
.bp{border:1px solid #1b3a52;border-radius:3px;background:#071a2a;padding:6px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;min-width:0}
.bp[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 14px rgba(255,198,107,.25)}
.bp canvas{width:100%;aspect-ratio:1;display:block}
.bp b{display:block;font:700 11px var(--f-mono);color:var(--glow);margin-top:4px;letter-spacing:.04em}
.bp span{display:block;font:11px/1.35 var(--f-body);color:var(--muted)}
.bp:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.hint2{font:11px var(--f-mono);color:#5d7c90}
.uptime{border:1px solid var(--glow);border-radius:3px;padding:10px 12px;margin:6px 0 12px;font:600 12px/1.5 var(--f-mono);color:var(--glow);background:rgba(102,220,255,.06);letter-spacing:.04em}
.uptime b{display:block;font-size:22px;color:var(--fg);text-shadow:0 0 12px rgba(102,220,255,.5);font-variant-numeric:tabular-nums}
.snd{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;z-index:3;pointer-events:auto;font:600 11px var(--f-mono);letter-spacing:.08em;
  color:var(--glow);background:rgba(6,12,18,.8);border:1px solid #1f3a4d;border-radius:3px;padding:7px 10px;cursor:pointer}
.snd:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.alert{position:absolute;left:50%;top:18%;transform:translateX(-50%);z-index:4;pointer-events:none;font:700 15px var(--f-mono);letter-spacing:.14em;color:#ff4d4d;
  border:1px solid #ff4d4d;background:rgba(40,0,0,.75);padding:9px 14px;border-radius:3px;text-shadow:0 0 12px #ff3030;white-space:nowrap}
.alert.ok{color:#7dffb2;border-color:#7dffb2;background:rgba(0,30,15,.75);text-shadow:0 0 12px #3dff8a}
#stage.over{animation:shake .09s linear infinite}
#stage.over .hud{color:#ff4d4d}#stage.over .hud .c{border-color:#ff4d4d}
#stage.over .ring{border-color:rgba(255,77,77,.6)}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){#stage.over{animation:none}}
/* екран завантаження */
#boot{position:fixed;inset:0;z-index:50;background:#020406;display:flex;flex-direction:column;justify-content:center;
  padding-block:24px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px));transition:opacity .6s}
#boot::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(102,220,255,.04) 0 1px,transparent 1px 3px)}
#boot .w{max-width:640px;width:100%;margin:0 auto}
#bootlog{font:13px/1.75 var(--f-mono);color:#9fdcf2;margin:0;white-space:pre-wrap;min-height:16em}
#bootlog .ok{color:#7dffb2}#bootlog .hi{color:var(--glow);text-shadow:0 0 10px var(--glow)}#bootlog .am{color:var(--gold)}
.bar{height:3px;background:#0f2230;margin:18px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--glow);box-shadow:0 0 12px var(--glow);transition:width .25s}
#bootBtn{font:700 15px var(--f-mono);letter-spacing:.14em;color:#001018;background:var(--glow);border:0;border-radius:3px;padding:15px 22px;cursor:pointer;
  box-shadow:0 0 30px rgba(102,220,255,.55);width:100%;max-width:640px;display:block;margin:0 auto}
#bootBtn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.skip{font:11px var(--f-mono);color:#4f6a7d;text-align:center;margin-top:12px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:54% 46%}
  aside{border-left:0;border-top:1px solid var(--line)}
  .story{padding:18px max(18px,env(safe-area-inset-left,0px)) 8px max(18px,env(safe-area-inset-right,0px))}
  h1{font-size:27px;margin:6px 0 8px}
  .story p{font-size:14.5px;margin-bottom:9px}
  .foot{display:none}
  .nav{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
}
@media (max-width:820px){ h1{font-size:23px} .hud .ro{font-size:9.5px} #bootlog{font-size:12px} }
@media (prefers-reduced-motion:reduce){.tag{transition:none}.ring,.hud .blink,h1 .cur{animation:none}.ln{animation:none;opacity:1;transform:none}}
</style>
</head>
<body>
<div id="boot" role="dialog" aria-label="Запуск">
  <div class="w"><pre id="bootlog"></pre><div class="bar"><i id="bootbar"></i></div></div>
  <button id="bootBtn" hidden>[ ЗАПУСТИТИ РЕАКТОР ]</button>
  <div class="skip" id="skip">торкнись, щоб пропустити</div>
</div>
<div class="app">
  <div id="stage">
    <canvas id="cv" aria-label="3D-модель реактора, можна крутити пальцем"></canvas>
    <div class="ring" id="ring1"></div><div class="ring r2" id="ring2"></div>
    <div id="tags"></div>
    <button class="snd" id="snd" aria-pressed="true">ЗВУК: ON</button>
    <div class="alert" id="alert" hidden></div>
    <div class="hud" aria-hidden="true">
      <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
      <div class="ro" id="ro"></div>
      <div class="ro2"><span class="blink">●</span> ARC REACTOR Ø140 · S/N 0001/0001<br><span id="ro2"></span></div>
    </div>
  </div>
  <aside>
    <div class="story" id="story" aria-live="polite"></div>
    <div class="foot">// працює і без інтернету · один файл · один екземпляр</div>
    <nav class="nav">
      <button class="btn" id="prev">◀ Назад</button>
      <div class="dots" id="dots"></div>
      <button class="btn primary" id="next">Далі →</button>
    </nav>
  </aside>
</div>

 { n:"01", title:'З днюхою, <em>Віл</em>', cam:{yaw:-24,pitch:10,zoom:1.0,gap:0}, led:1, spin:1,
   html:`<p>Віталік, 23 — це серйозно, тому і подарунок серйозний. Короче: такого реактора більше ні в кого нема — і не буде. Він існує в одному екземплярі, і цей екземпляр твій.</p>
         <p>Я його не купив. Сам придумав, сам вирізав на ЧПК, сам зібрав по шарах. А в самому серці — ми. Тисни «Далі», покажу, що там всередині.</p>`,
   tags:[{p:[0,25,20.5],t:"тут ми",c:""}] },
 { n:"02", title:'Як він <em>світиться</em>', cam:{yaw:0,pitch:4,zoom:1.18,gap:0}, led:1,
   html:`<p>Всередині два прозорі диски, а навколо них по краю обклеєна LED-стрічка — світлодіодами всередину.</p>
         <p>Світло біжить прямо в товщі акрилу і вилазить тільки там, де я фрезою вигравіював лінії. Тому горять «обмотки» 12 котушок і дуги 6 секторів, а все інше темне. Ніякої фарби — чисто фізика.</p>`,
   tags:[{p:[0,54,20],t:"гравіювання світиться",c:""},{p:[-48,-48,22],t:"12 котушок",c:""}] },
 { n:"03", title:'Шість <em>шарів</em>', cam:{yaw:-52,pitch:16,zoom:0.86,gap:15}, led:1,
   html:`<p>Ось він розібраний. Шість шарів по 4 мм: спереду чорні маска, обідок і зірка, за ними два світловоди з гравіюванням, кільця, порожнина під дріт і задня пластина.</p>
         <p>16 різних деталей, кожну я креслив і вирізав окремо. Разом — 24 мм.</p>`,
   tags:[{p:[0,72,22],t:"маска + обідок",c:"",lvl:5},{p:[0,-60,14],t:"світловоди",c:"",lvl:3},{p:[0,-72,2],t:"задня пластина",c:"",lvl:0}] },
 { n:"04", title:'Серце <em>реактора</em>', cam:{yaw:-10,pitch:6,zoom:2.5,gap:0}, led:1,
   html:`<p>Ось ми — під віконцем 3 мм, у чорній гільзі. Я спеціально зробив так, щоб світло від стрічки впиралось у чорні стінки і на фото не падало, тому воно не засвічується і не вигорить.</p>
         <p>Захочеш інше фото — відкручуєш 3 гайки ззаду, і за дві хвилини там новий кадр. Але це краще не міняй 😄</p>`,
   tags:[{p:[0,-25,20.5],t:"віконце 3 мм",c:""},{p:[24,22,20.5],t:"чорна гільза",c:""}] },
 { n:"05", title:'Звідки <em>струм</em>', cam:{yaw:210,pitch:24,zoom:0.82,gap:11}, led:1, wire:1,
   html:`<p>Живиться від звичайного USB — від зарядки або від павербанка. Тобто світить навіть коли світло вирубили.</p>
         <p>Кабель (синій) заходить ззаду через проріз, йде схованою порожниною (вона підсвічена) донизу і підключається до стрічки. Зовні нічого не видно.</p>`,
   tags:[{p:[92,-24,-16],t:"USB",c:"wire"},{p:[38,-18,6],t:"порожнина",c:"wire",lvl:1},{p:[0,-61,10],t:"початок стрічки",c:"wire",lvl:2}] },
 { n:"06", title:'Як <em>зібрано</em>', cam:{yaw:-40,pitch:20,zoom:0.9,gap:13}, led:0, glue:1,
   html:`<div class="legend">
          <div><i style="background:#ff9a3c"></i>склеєно: морда реактора і підставка</div>
          <div><i style="background:#5f8fb3"></i>без клею — тримають 3 гвинти M3</div>
          <div><i style="background:#e7edf2"></i>просто вкладено: віконце, фото, підкладки</div></div>
         <p>Я спеціально зробив його розбірним. Якщо колись щось треба буде замінити — нічого ламати не доведеться.</p>`,
   tags:[{p:[0,66.25,24],t:"гвинт M3",c:"gold",lvl:5}] },
 { n:"07", title:'Креслення', cam:{yaw:-38,pitch:14,zoom:0.86,gap:14}, led:1, bp:1,
   html:`<p>Розріз A-A — ніби реактор розпиляли навпіл по вертикалі. Видно всі 6 шарів, LED на торці і фото в гільзі.</p>

         <div class="hint2">// тапни деталь — підсвічу її в 3D</div>
         <div class="bp-grid" id="bpGrid"></div>`, tags:[] },
 { n:"08", title:'Один <em>такий</em>', cam:{yaw:-30,pitch:12,zoom:1.0,gap:0}, led:1, spin:1,
   html:`<div class="stats">
          <div><b>1 / 1</b><span>екземпляр у світі</span></div><div><b>16</b><span>деталей вручну</span></div>

         <p>З днем народження, Віл. Крути його сам — пальцем на моделі.</p>`, tags:[] },

function setPlane(O,u,v){const s=scale()*DPR, cx=W*DPR*.5, cy=H*DPR*.53;
  const ru=rot(u),rv=rot(v),ro=rot(center(O));
  ctx.setTransform(s*ru[0],-s*ru[1],s*rv[0],-s*rv[1],cx+s*ro[0],cy-s*ro[1]);}

function slab(pid,z0,front,extra){
  const mat=GEO[pid].mat; let [body,side]=COL[mat];
  if(glue && GLUE[pid]) [body,side]=GLUECOL[GLUE[pid]];
  const opaque = mat==="BLACK4" || (glue && GLUE[pid]==="g");
  const N=opaque?6:3, ord=[...Array(N+1).keys()]; if(!front) ord.reverse();
  const dim = focus && pid!==focus; if(dim) ctx.globalAlpha=.1;
  if(focus && pid===focus){ body="#ffc66b"; side="#8a5a14"; }
  ord.forEach((k,i)=>{
    const last=i===N; setPlane([0,0,z0+T*k/N],UX,UY);
    ctx.fillStyle=last?body:side; ctx.fill(PATH[pid],"evenodd");
    if(!last) return;
    ctx.lineWidth=.4; ctx.strokeStyle=opaque?"rgba(255,255,255,.10)":"rgba(170,225,255,.32)"; ctx.stroke(PATH[pid]);
    if(ENG[pid]){
      const lg=pid==="L1"||pid==="L2";
      ctx.strokeStyle=lg?"#6f8796":"rgba(220,228,236,.5)"; ctx.lineWidth=lg?.6:.4; ctx.stroke(ENG[pid]);
      if(lg && !glue && led>0.02){ ctx.globalAlpha=Math.min(1,led);
        ctx.strokeStyle=overload?"rgba(255,70,60,.45)":"rgba(120,220,255,.33)"; ctx.lineWidth=2.4; ctx.stroke(ENG[pid]);
        ctx.strokeStyle=overload?"#ffd2cc":"#effdff"; ctx.lineWidth=.6; ctx.stroke(ENG[pid]); ctx.globalAlpha=1; }
    }
    if(extra && !dim) extra();
  });
  ctx.globalAlpha=1;
}
function glowDisc(){ if(led<0.02||glue) return; ctx.globalAlpha=Math.min(1,led);
  const g=ctx.createRadialGradient(0,0,26,0,0,60);
  if(overload){g.addColorStop(0,"rgba(255,40,30,0)");g.addColorStop(.3,"rgba(255,60,40,.35)");g.addColorStop(.85,"rgba(255,120,90,.55)");g.addColorStop(1,"rgba(255,120,90,0)");}
  else {g.addColorStop(0,"rgba(80,200,255,0)");g.addColorStop(.3,"rgba(90,210,255,.26)");g.addColorStop(.85,"rgba(150,235,255,.42)");g.addColorStop(1,"rgba(150,235,255,0)");}
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(0,0,59,0,7); ctx.arc(0,0,28.3,0,7,true); ctx.fill("evenodd"); ctx.globalAlpha=1; }
function drawPhoto(z){ setPlane([0,0,z],UX,UY); ctx.save(); if(focus) ctx.globalAlpha=.15; ctx.beginPath(); ctx.arc(0,0,24.9,0,7); ctx.clip();
  if(glue){ctx.fillStyle="#e7edf2";ctx.fill();}
  else if(photoReady){ ctx.transform(1,0,0,-1,0,0); ctx.drawImage(photoImg,-24.9,-24.9,49.8,49.8); }
  else {ctx.fillStyle="#d6a462";ctx.fill();}
  ctx.restore(); }
function drawStand(alpha){
  if(alpha<=0.01) return;
  const fromTop=rot([0,1,0])[2]>0;
  ["ST0","ST1","ST2","ST3"].forEach((pid,i)=>{
    const y0=-74+i*T;
    const sdim = focus && focus!==pid; const sfoc = focus===pid;
    for(let k=0;k<=3;k++){const kk=fromTop?k:3-k; setPlane([0,y0+T*kk/3,12+2.5*st.gap],UX,[0,0,-1]); ctx.globalAlpha=sdim?.1:1;
      if(sfoc){ctx.fillStyle=k===3?"#ffc66b":"#8a5a14"; ctx.fill(PATH[pid],"evenodd"); continue;}
      if(glue){ctx.fillStyle=k===3?"rgba(255,154,60,.85)":"rgba(156,82,22,.6)";}
      else ctx.fillStyle=k===3?`rgba(190,232,255,${.2*alpha})`:`rgba(140,200,230,${.1*alpha})`;
      ctx.fill(PATH[pid],"evenodd");
      if(k===3){ctx.strokeStyle=`rgba(170,225,255,${.4*alpha})`;ctx.lineWidth=.4;ctx.stroke(PATH[pid]);}}
    ctx.globalAlpha=1;
  });
}
function wirePts(){const z=(l,dz)=>l*T+dz+l*st.gap;
  return [[92,-30,-16],[70,-40,-14],[38,-46,-11],[8,-44,-6],[0,-42,z(0,2)],[0,-42,z(1,2)],[0,-50,z(1,2)],[0,-59,z(1,2.2)],[0,-61.4,z(2,.5)],[0,-61.4,z(2,2)]];}
function drawWire(){
  const P=wirePts().map(project); ctx.setTransform(DPR,0,0,DPR,0,0);
  // плавна крива через точки
  ctx.beginPath(); ctx.moveTo(P[0][0],P[0][1]);
  for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2; ctx.quadraticCurveTo(P[i][0],P[i][1],mx,my);}

  ctx.lineCap="round"; ctx.lineJoin="round";
  ctx.strokeStyle="rgba(61,139,255,.35)"; ctx.lineWidth=Math.max(5,3.4*scale()); ctx.stroke();
  ctx.strokeStyle="#3d8bff"; ctx.lineWidth=Math.max(2.4,1.6*scale()); ctx.stroke();
  // штекер
  const a=P[0]; ctx.fillStyle="#1d2128"; ctx.strokeStyle="#3d8bff"; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(a[0]-9*scale(),a[1]-5*scale(),18*scale(),10*scale(),3) : ctx.rect(a[0]-9*scale(),a[1]-5*scale(),18*scale(),10*scale()); ctx.fill(); ctx.stroke();
}
function drawCavity(z0){ for(const k of [0,1]){ setPlane([0,0,z0+.3+k*(T-.6)],UX,UY); ctx.fillStyle="rgba(61,139,255,.26)"; ctx.fill(CAVITY,"evenodd"); }
  ctx.strokeStyle="rgba(110,170,255,.9)"; ctx.lineWidth=.6; ctx.stroke(CAVITY); }

function draw(){
  if(!W) return;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  const front=rot([0,0,1])[2]>0, fromTop=rot([0,1,0])[2]>0, standA=(focus&&focus.startsWith("ST"))?1:Math.max(0,1-st.gap/3);
  if(fromTop) drawStand(standA);
  const lv=[0,1,2,3,4,5]; if(!front) lv.reverse();
  for(const l of lv){
    const zl=l*T+l*st.gap;
    const cart=()=>{ if(l!==4) return;
      if(front){ drawPhoto(16.8+4*st.gap); setPlane([0,0,20+4*st.gap],UX,UY); ctx.fillStyle="rgba(255,255,255,.07)"; ctx.fill(PATH.W1);
        ctx.strokeStyle="rgba(255,255,255,.18)"; ctx.lineWidth=.3; ctx.stroke(PATH.W1); }
      else { setPlane([0,0,16.7+4*st.gap],UX,UY); ctx.fillStyle=glue?"#e7edf2":"#111"; ctx.fill(PATH.K1); } };
    if(!front) cart();
    for(const [pid,L] of STACK) if(L===l) slab(pid,zl,front,(front&&(pid==="L1"||pid==="L2"))?glowDisc:null);
    if(l===1 && wire) drawCavity(zl);
    if(l===2||l===3){ setPlane([0,0,zl+T/2],UX,UY);
      ctx.strokeStyle = glue?"#ffe066": led>.5?"rgba(255,248,214,.95)":"rgba(200,200,190,.5)"; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.arc(0,0,60.4,0,7); ctx.stroke(); }
    if(l===1 && wire && front) drawWire();
    if(front) cart();
  }
  if(wire && !front) drawWire();
  if(!fromTop) drawStand(standA);
  placeTags(); hud();
}

const tagsEl=document.getElementById("tags"); let curTags=[];
function setTags(list){ tagsEl.innerHTML=""; curTags=list.map(t=>{const d=document.createElement("div"); d.className="tag "+(t.c||""); d.textContent=t.t; d.style.opacity=0; tagsEl.appendChild(d); return {el:d,...t};});

const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let anim=null, userTouched=false;
function goTo(cam){
  const from={...st}, to={yaw:cam.yaw*D2R,pitch:cam.pitch*D2R,zoom:cam.zoom,gap:cam.gap};
  let dy=to.yaw-from.yaw; dy=((dy+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI; to.yaw=from.yaw+dy;
  const t0=performance.now(), dur=reduce?1:1300;
  anim={from,to,t0,dur};
}
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  let dirty=false;
  if(anim){ let k=Math.min(1,(t-anim.t0)/anim.dur); const e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    for(const key of ["yaw","pitch","zoom","gap"]) st[key]=anim.from[key]+(anim.to[key]-anim.from[key])*e;
    if(k>=1) anim=null; dirty=true; }
  else if(spin && !drag && !reduce){ st.yaw+=(t-last)*0.00022; dirty=true; }
  if(overload){ led=.6+Math.random()*.6; st.yaw+=(Math.random()-.5)*.012; dirty=true; }
  else if(t<flickerUntil){ led = Math.random()<.5 ? .15+Math.random()*.4 : .9; dirty=true; }
  else if(Math.abs(led-ledTarget)>.005){ led+=(ledTarget-led)*.09; dirty=true; } else if(led!==ledTarget){ led=ledTarget; dirty=true; }
  last=t; if(dirty) draw();
}

let drag=null; const pts=new Map();
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);drag={d:0};anim=null;cv.style.cursor="grabbing";});
cv.addEventListener("pointermove",e=>{ if(!pts.has(e.pointerId)) return; const pr=pts.get(e.pointerId); pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===2){const [a,b]=[...pts.values()];const dd=Math.hypot(a[0]-b[0],a[1]-b[1]); if(drag.d) st.zoom=Math.max(.5,Math.min(3.4,st.zoom*dd/drag.d)); drag.d=dd; draw(); return;}
  st.yaw+=(e.clientX-pr[0])*.009; st.pitch=Math.max(-1.45,Math.min(1.45,st.pitch+(e.clientY-pr[1])*.009)); draw(); });
const up=e=>{pts.delete(e.pointerId); if(!pts.size){drag=null;cv.style.cursor="grab";}};
cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
cv.addEventListener("wheel",e=>{e.preventDefault();anim=null;st.zoom=Math.max(.5,Math.min(3.4,st.zoom*Math.exp(-e.deltaY*.0012)));draw();},{passive:false});

// ================== КРЕСЛЕННЯ ==================
function bbox(pid){let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const c of GEO[pid].c)for(const p of c){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}return [x0,y0,x1,y1];}
function sectionIntervals(pid){const ys=[];for(const c of GEO[pid].c){for(let i=0;i<c.length;i++){const a=c[i],b=c[(i+1)%c.length];
  if((a[0]<=0&&0<b[0])||(b[0]<=0&&0<a[0])){const t=-a[0]/(b[0]-a[0]);ys.push(a[1]+t*(b[1]-a[1]));}}}ys.sort((p,q)=>p-q);const r=[];for(let i=0;i+1<ys.length;i+=2)r.push([ys[i],ys[i+1]]);return r;}
function prepCanvas(cv){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(10,Math.round(r.width*d));cv.height=Math.max(10,Math.round(r.height*d));const g=cv.getContext("2d");g.scale(d,d);return [g,r.width,r.height];}
function bpGrid(g,w,h){g.fillStyle="#071a2a";g.fillRect(0,0,w,h);g.strokeStyle="rgba(102,220,255,.08)";g.lineWidth=1;for(let x=0;x<w;x+=12){g.beginPath();g.moveTo(x+.5,0);g.lineTo(x+.5,h);g.stroke();}for(let y=0;y<h;y+=12){g.beginPath();g.moveTo(0,y+.5);g.lineTo(w,y+.5);g.stroke();}}
function drawSection(){
  const cv=document.getElementById("bpSec"); if(!cv) return; const [g,w,h]=prepCanvas(cv); bpGrid(g,w,h);
  const EX=2.5, scY=Math.min((h-58)/77,(w-150)/(24*EX)), scZ=scY*EX, ox=18, oy=h-22-5*scY;
  const Y=y=>oy-y*scY, Z=z=>ox+z*scZ;
  g.save(); g.beginPath(); g.rect(0,Y(72),w,Y(-5)-Y(72)); g.clip();
  for(const [pid,l] of STACK){ const mat=GEO[pid].mat;
    for(const [a,b] of sectionIntervals(pid)){ if(b<-5) continue; const x=Z(l*T), y=Y(b), hh=(Math.min(b,72)-Math.max(a,-6))*scY, ww=T*scZ;
      g.fillStyle=mat==="BLACK4"?"#1e2a33":"rgba(140,210,240,.2)"; g.fillRect(x,y,ww,hh);
      if(mat!=="BLACK4"){ g.save(); g.beginPath(); g.rect(x,y,ww,hh); g.clip(); g.strokeStyle="rgba(159,227,255,.3)"; g.lineWidth=1;
        for(let k=-hh;k<ww+hh;k+=6){g.beginPath();g.moveTo(x+k,y);g.lineTo(x+k+hh,y+hh);g.stroke();} g.restore(); }
      g.strokeStyle=mat==="BLACK4"?"#7fb6cf":"#9fe3ff"; g.lineWidth=1; g.strokeRect(x+.5,y+.5,ww-1,hh-1); } }
  g.fillStyle="#141414"; g.fillRect(Z(4.8),Y(24.9),12*scZ,29.9*scY);
  g.fillStyle="#d6a462"; g.fillRect(Z(16.6),Y(24.9),.5*scZ,29.9*scY);
  g.fillStyle="rgba(255,255,255,.28)"; g.fillRect(Z(17),Y(24.9),3*scZ,29.9*scY);
  g.fillStyle="#ffe680"; g.shadowColor="#ffe680"; g.shadowBlur=10; g.fillRect(Z(8),Y(61.2),8*scZ,2.2*scY); g.shadowBlur=0;
  g.fillStyle="#9aa3ab"; g.fillRect(Z(-0.8),Y(66.25)-2,24.8*scZ,4);
  g.restore();
  g.setLineDash([6,4]); g.strokeStyle="rgba(255,198,107,.7)"; g.beginPath(); g.moveTo(4,Y(0)); g.lineTo(Z(24)+8,Y(0)); g.stroke(); g.setLineDash([]);
  g.strokeStyle="#fff"; g.fillStyle="#fff"; g.lineWidth=1; g.font="600 10px ui-monospace,Menlo,monospace"; g.textAlign="center";
  const yT=Y(72)-8; g.beginPath(); g.moveTo(Z(0),yT); g.lineTo(Z(24),yT); g.stroke();
  [Z(0),Z(24)].forEach(x=>{g.beginPath();g.moveTo(x,yT-4);g.lineTo(x,yT+4);g.stroke();}); g.fillText("24 мм",Z(12),yT-5);
  g.textAlign="left"; g.font="10px ui-monospace,Menlo,monospace";
  const lx=Z(24)+12;
  [[Y(60),"LED-стрічка 5V"],[Y(66.25)-11,"гвинт M3"],[Y(43),"порожнина"],[Y(14),"фото + віконце"],[Y(0)-6,"вісь"]].forEach(([y,t],i)=>{
    g.fillStyle=i===4?"#ffc66b":"#9fe3ff"; g.fillText(t,lx,y+3); });
  g.fillStyle="#5d7c90"; g.fillText("A-A · верхня половина · товщина ×2.5",8,h-7);
  g.fillStyle="#7fa3b8"; g.textAlign="left"; g.fillText("назад",Z(0),yT-16); g.textAlign="right"; g.fillText("перед →",Z(24),yT-16);
}
function drawPart(cv,pid){
  const [g,w,h]=prepCanvas(cv); bpGrid(g,w,h);
  const [x0,y0,x1,y1]=bbox(pid), sc=Math.min((w-18)/(x1-x0),(h-28)/(y1-y0));
  const cx=w/2-(x0+x1)/2*sc, cy=(h-10)/2+(y0+y1)/2*sc;
  g.setTransform(g.getTransform().a*sc,0,0,-g.getTransform().a*sc,g.getTransform().a*cx,g.getTransform().a*cy);
  const d=Math.min(2,devicePixelRatio||1);
  g.fillStyle=GEO[pid].mat==="BLACK4"?"rgba(30,42,51,.9)":"rgba(140,210,240,.16)"; g.fill(PATH[pid],"evenodd");
  g.strokeStyle="#9fe3ff"; g.lineWidth=1.1/sc; g.stroke(PATH[pid]);
  if(ENG[pid]){ g.strokeStyle="rgba(255,198,107,.8)"; g.lineWidth=.7/sc; g.stroke(ENG[pid]); }
  g.setTransform(d,0,0,d,0,0);
  g.fillStyle="#ffffff"; g.font="600 10px ui-monospace,Menlo,monospace"; g.textAlign="center";
  const dw=Math.round(x1-x0), dh=Math.round(y1-y0);
  g.fillText(dw===dh?`Ø${(x1-x0).toFixed(1).replace(".0","")}`:`${dw}×${dh}`, w/2, h-6);
}
function buildBlueprints(){
  const grid=document.getElementById("bpGrid"); if(!grid) return;
  grid.innerHTML=BP_ORDER.map(pid=>`<button class="bp" data-pid="${pid}" aria-pressed="false"><canvas></canvas><b>${pid}${QTY[pid]?" ×"+QTY[pid]:""}</b><span>${GEO[pid].name}</span><span>${MATSHORT[GEO[pid].mat]} мм${GEO[pid].e.length?" · гравіювання":""}</span></button>`).join("");
  requestAnimationFrame(()=>{ drawSection(); grid.querySelectorAll(".bp").forEach(b=>drawPart(b.querySelector("canvas"),b.dataset.pid)); });

    const pid=b.dataset.pid; focus = focus===pid?null:pid;

    if(focus && focus.startsWith("ST")) goTo({yaw:-30,pitch:30,zoom:.95,gap:0});

}

let AC=null, soundOn=true;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } } if(AC&&AC.state==="suspended") AC.resume(); return AC; }
function tone(f0,f1,dur,type,vol,delay=0,filt){ const a=ac(); if(!a||!soundOn) return; const t=a.currentTime+delay;
  const o=a.createOscillator(), gn=a.createGain(); o.type=type; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  gn.gain.setValueAtTime(0.0001,t); gn.gain.exponentialRampToValueAtTime(vol,t+Math.min(.08,dur/3)); gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=o; if(filt){ const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=filt; o.connect(lp); node=lp; }
  node.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t+dur+.05); }
function noise(dur,vol,delay=0){ const a=ac(); if(!a||!soundOn) return; const t=a.currentTime+delay, n=a.sampleRate*dur, buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3); const s=a.createBufferSource(), g=a.createGain(); s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(a.destination); s.start(t); }
function sfxPowerUp(){
  tone(38,120,1.6,"sawtooth",.16,0,420);          // наростаючий гул
  tone(55,165,1.6,"square",.035,0,900);
  [0.35,0.55,0.75].forEach((d,i)=>tone(880+i*220,880+i*220,.07,"square",.05,d)); // писк систем
  noise(.06,.35,1.15);                              // «клац»
  tone(1320,1980,.25,"sine",.08,1.2);
  tone(110,108,2.6,"sine",.07,1.3,300);             // рівний гул реактора
  try{ navigator.vibrate&&navigator.vibrate([30,80,30,80,160]); }catch(e){}
}
function sfxBeep(){ tone(1400,1400,.05,"square",.03); }
function sfxAlarm(){ for(let i=0;i<6;i++){ tone(880,440,.22,"sawtooth",.09,i*.3,2400); } tone(60,30,2,"sawtooth",.12,0,300);
  try{ navigator.vibrate&&navigator.vibrate([200,100,200,100,200,100,400]); }catch(e){} }
function sfxCalm(){ tone(660,990,.18,"sine",.08); tone(990,1320,.2,"sine",.07,.18); }
const sndBtn=document.getElementById("snd");
sndBtn.onclick=()=>{ soundOn=!soundOn; sndBtn.setAttribute("aria-pressed",soundOn); sndBtn.textContent="ЗВУК: "+(soundOn?"ON":"OFF"); if(soundOn) sfxBeep(); };

// ================== ПАСХАЛКА: 5 тапів = перевантаження ==================
let taps=[], tapStart=null;
cv.addEventListener("pointerdown",e=>{ tapStart=[e.clientX,e.clientY,performance.now()]; });
cv.addEventListener("pointerup",e=>{ if(!tapStart) return; const [x,y,t0]=tapStart; tapStart=null;
  if(Math.hypot(e.clientX-x,e.clientY-y)>8 || performance.now()-t0>350) return;
  const now=performance.now(); taps=taps.filter(t=>now-t<1800); taps.push(now);
  if(taps.length>=5 && !overload){ taps=[]; triggerOverload(); } else if(!overload) sfxBeep(); });
const alertEl=document.getElementById("alert"), stageEl=document.getElementById("stage");
function triggerOverload(){
  overload=1; stageEl.classList.add("over"); alertEl.className="alert"; alertEl.hidden=false;
  alertEl.textContent="⚠ ПЕРЕВАНТАЖЕННЯ 300%"; sfxAlarm();
  setTimeout(()=>{ alertEl.textContent="⚠ ОХОЛОДЖЕННЯ…"; },1300);
  setTimeout(()=>{ overload=0; stageEl.classList.remove("over"); alertEl.className="alert ok"; alertEl.textContent="✓ СТАБІЛІЗОВАНО. НЕ РОБИ ТАК 😄"; sfxCalm(); ledTarget=STEPS[cur].led?1:0; draw(); },2700);
  setTimeout(()=>{ alertEl.hidden=true; },4700);
}
let typeTimer=null;
function typeTitle(html){
  const el=document.getElementById("ttl"), plain=html.replace(/<[^>]+>/g,"");
  clearInterval(typeTimer);
  if(reduce){ el.innerHTML=html; return; }
  let i=0; el.innerHTML='<span class="cur"></span>';
  typeTimer=setInterval(()=>{ i++; el.innerHTML=plain.slice(0,i)+'<span class="cur"></span>'; if(i>=plain.length){ clearInterval(typeTimer); el.innerHTML=html+'<span class="cur"></span>'; } },38);
}
function countUp(){
  document.querySelectorAll(".stats b").forEach(b=>{ const txt=b.textContent, m=txt.match(/\d+/); if(!m||reduce) return;
    const target=+m[0], t0=performance.now();
    const tick=t=>{ const k=Math.min(1,(t-t0)/900); b.textContent=txt.replace(m[0],String(Math.round(target*k*k*(3-2*k)))); if(k<1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick); });
}
document.getElementById("prev").onclick=()=>show(cur-1);
document.getElementById("next").onclick=()=>show(cur===STEPS.length-1?0:cur+1);
addEventListener("keydown",e=>{if(e.key==="ArrowRight")show(cur+1); if(e.key==="ArrowLeft")show(cur-1);});

function resize(){DPR=Math.min(2,devicePixelRatio||1); W=cv.clientWidth; H=cv.clientHeight; cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); draw();}
addEventListener("resize",()=>{resize(); if(STEPS[cur].bp){drawSection(); document.querySelectorAll(".bp").forEach(b=>drawPart(b.querySelector("canvas"),b.dataset.pid));}});
resize(); show(0); requestAnimationFrame(frame); ledTarget=0; led=0;

];
const bootEl=document.getElementById("boot"), logEl=document.getElementById("bootlog"), barEl=document.getElementById("bootbar"), btn=document.getElementById("bootBtn");
var bootDone=false; let bootTimers=[];
function finishLog(){ bootTimers.forEach(clearTimeout);
  logEl.innerHTML=BOOT.map(([a,c,b])=>c&&!b?`<span class="${c}">${a}</span>`:`${a} <span class="${c}">${b}</span>`).join("\n");
  barEl.style.width="100%"; btn.hidden=false; document.getElementById("skip").hidden=true; bootDone=true; btn.focus(); }
function runBoot(){
  if(reduce){ finishLog(); return; }
  let tAcc=200;
  BOOT.forEach(([a,c,b],i)=>{ tAcc+= a.includes("копій")?1000:240+Math.random()*150;
    bootTimers.push(setTimeout(()=>{ const ln=(c&&!b)?`<span class="${c}">${a}</span>`:`${a} <span class="${c}">${b}</span>`;
      logEl.innerHTML+=(i?"\n":"")+ln; if(soundOn&&AC) sfxBeep(); barEl.style.width=((i+1)/BOOT.length*100)+"%"; if(i===BOOT.length-1) finishLog(); },tAcc)); });
}
bootEl.addEventListener("click",e=>{ if(!bootDone && e.target!==btn) finishLog(); });
btn.onclick=()=>{ sfxPowerUp(); bootEl.style.opacity=0; setTimeout(()=>bootEl.hidden=true,600);
  flickerUntil=performance.now()+(reduce?0:900); ledTarget=STEPS[cur].led?1:0; };
runBoot();
</script>
